[project]
name = "orchestrator"
version = "0.1.0"
description = "Prefect flow that runs the hourly extract -> transform batch"
requires-python = ">=3.12"
dependencies = [
    "prefect==3.8.7",
    "pydantic>=2.13.5",
    "transformer",
]

[dependency-groups]
dev = ["ruff==0.16.10"]

[tool.uv]
package = false
constraint-dependencies = ["sqlalchemy<2.1"]

[tool.uv.sources]
transformer = { path = "../transformer", editable = true }

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
