global:
  scrape_interval: 15s

scrape_configs:
  - job_name: ingestor
    static_configs:
      - targets: ["ingestor:8080"]

  # Keep the job/source labels the batch jobs pushed, instead of job="pushgateway".
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
