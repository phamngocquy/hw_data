[project]
name = "transformer"
version = "0.1.0"
description = "Normalizes raw data-lake files into the processed layer; one sub-package per data pipeline"
requires-python = ">=3.12"
dependencies = [
    "prometheus-client==0.26.0",
]

[project.scripts]
transformer = "transformer.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
